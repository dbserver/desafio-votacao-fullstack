services:
  app:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: app
    restart: always
    depends_on:
      - database
    ports:
      - "8080:8080"
    environment:
      - MYSQL_DATABASE=database
      - MYSQL_ROOT_USERNAME=root
      - MYSQL_ROOT_PASSWORD=root

  database:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=votingdb
      - MYSQL_ROOT_USERNAME=root
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    ports:
      - "3306:3306"
