spring.application.name=votacao-api
server.port=8080

## JPA - Only validate tables on database
spring.jpa.hibernate.ddl-auto=validate

## Flyway
spring.flyway.enabled=true

## MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_DATABASE:localhost}:3306/votingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ROOT_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}