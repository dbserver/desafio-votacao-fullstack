spring.application.name=votacao-api
server.port=8080

## JPA - Auto create tables on database
spring.jpa.hibernate.ddl-auto=update

## MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_DATABASE:localhost}:3306/votingdb
spring.datasource.username=${MYSQL_ROOT_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}