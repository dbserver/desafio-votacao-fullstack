spring:
  application:
    name: voting

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/voting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080
